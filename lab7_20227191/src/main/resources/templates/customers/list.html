<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Clientes</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/menu :: menu}"></div>

<h1>Clientes</h1>
<p class="msg" th:if="${msg}" th:text="${msg}"></p>
<p class="error" th:if="${error}" th:text="${error}"></p>

<a th:href="@{/customers/new}">+ Nuevo cliente</a>

<table>
    <tr><th>ID</th><th>Nombre</th><th>Tipo</th><th>Documento</th><th>Acciones</th></tr>
    <tr th:each="c : ${customers}">
        <td th:text="${c.id}"></td>
        <td th:text="${c.name}"></td>
        <td th:text="${c.documentType}"></td>
        <td th:text="${c.document}"></td>
        <td>
            <a th:href="@{/customers/edit(id=${c.id})}">Editar</a>
            <form class="inline" th:action="@{/customers/delete}" method="post">
                <input type="hidden" name="id" th:value="${c.id}" style="min-width:0">
                <button type="submit">Eliminar</button>
            </form>
        </td>
    </tr>
</table>
</body>
</html>
