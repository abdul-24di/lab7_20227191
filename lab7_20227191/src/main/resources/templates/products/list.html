<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Catálogo</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/menu :: menu}"></div>

<h1>Catálogo de productos</h1>
<p class="msg" th:if="${msg}" th:text="${msg}"></p>
<p class="error" th:if="${error}" th:text="${error}"></p>

<a th:href="@{/products/new}">+ Nuevo producto</a>

<table>
    <tr><th>ID</th><th>Nombre</th><th>Precio</th><th>Stock</th><th>Acciones</th></tr>
    <tr th:each="p : ${products}">
        <td th:text="${p.id}"></td>
        <td th:text="${p.name}"></td>
        <td th:text="${#numbers.formatDecimal(p.price, 1, 2)}"></td>
        <td th:text="${p.stock}"></td>
        <td>
            <a th:href="@{/products/edit(id=${p.id})}">Editar</a>
            <form class="inline" th:action="@{/products/delete}" method="post">
                <input type="hidden" name="id" th:value="${p.id}" style="min-width:0">
                <button type="submit">Eliminar</button>
            </form>
        </td>
    </tr>
</table>
</body>
</html>
