<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Producto</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/menu :: menu}"></div>

<h1 th:text="${product.id == null} ? 'Nuevo producto' : 'Editar producto'">Producto</h1>

<form th:action="@{/products/save}" th:object="${product}" method="post">
    <input type="hidden" th:field="*{id}">

    <label>Nombre</label>
    <input type="text" th:field="*{name}">
    <p class="error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></p>

    <label>Precio</label>
    <input type="text" th:field="*{price}">
    <p class="error" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></p>

    <label>Stock disponible</label>
    <input type="text" th:field="*{stock}">
    <p class="error" th:if="${#fields.hasErrors('stock')}" th:errors="*{stock}"></p>

    <br><br>
    <button type="submit">Guardar</button>
    <a th:href="@{/products}">Cancelar</a>
</form>
</body>
</html>
